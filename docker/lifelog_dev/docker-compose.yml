services:

  # ----------------------------
  # PostgreSQL
  # ----------------------------
  db:
    image: postgres:16-alpine
    container_name: lifelog_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------
  # Redis (Celery Broker)
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: lifelog_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------
  # Django Web App
  # ----------------------------
  web:
    build:
      context: ../../
      dockerfile: docker/lifelog_dev/Dockerfile
    container_name: lifelog_web_dev
    command: uv run python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    env_file:
      - ../../.env
    environment:
      DJANGO_ENV: dev
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../:/app
    stdin_open: true
    tty: true

  # ----------------------------
  # Celery Worker
  # ----------------------------
  celery:
    build:
      context: ../../
      dockerfile: docker/lifelog_dev/Dockerfile
    container_name: lifelog_celery_worker_dev
    command: celery -A LifeLog worker --concurrency=1 --loglevel=info
    env_file:
      - ../../.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ../../:/app

  # ----------------------------
  # Celery Beat (Optional but Recommended)
  # ----------------------------
  celery-beat:
    build:
      context: ../../
      dockerfile: docker/lifelog_dev/Dockerfile
    container_name: lifelog_celery_beat_dev
    command: celery -A LifeLog beat --loglevel=info
    env_file:
      - ../../.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ../../:/app

  # ----------------------------
  # pgweb (Database UI)
  # ----------------------------
  pgweb:
    image: sosedoff/pgweb
    container_name: lifelog_pgweb_dev
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
  redis_data_dev: